kind = "web"
previewPath = "/hkfe"
title = "HK Toto Pro — React (Dev)"
version = "1.0.0"
id = "artifacts/hk-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/hkfe" ]
localPort = 18654

[services.development]
run = "pnpm --filter @workspace/hk-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hk-frontend", "run", "build" ]
publicDir = "artifacts/hk-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18654"
BASE_PATH = "/hkfe"
